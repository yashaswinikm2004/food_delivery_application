<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodExpress - Sign Up</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5eb, #ffe0c2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .signup-container {
            width: 420px;
            background-color: white;
            padding: 35px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            color: #ff6b00;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            color: #333;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 5px rgba(255, 107, 0, 0.2);
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #ff6b00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .signup-btn:hover {
            background-color: #e85d00;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-text a {
            color: #ff6b00;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">🍴 FoodExpress</div>

        <h2 class="title">Create an Account</h2>

        <p class="subtitle">
            Sign up to order delicious food and enjoy the best experience.
        </p>

        <form action="register" method="post">

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Enter your full name"
                    required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email ID</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email address"
                    required>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="Enter your phone number"
                    required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Confirm your password"
                    required>
            </div>

            <!-- Role -->
            <div class="form-group">
                <label for="role">Select Role</label>

                <select id="role" name="role" required>

                    <option value="">-- Select Role --</option>

                    <option value="customer">
                        Customer
                    </option>

                    <option value="restaurant">
                        Restaurant
                    </option>

                    <option value="super_admin">
                        Super Admin
                    </option>

                </select>
            </div>

            <!-- Sign Up Button -->
            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</body>
</html>
