<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodExpress - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fff5eb,#ffe0c2);
    padding:30px;
}

.login-container{
    width:400px;
    background:#fff;
    padding:35px 40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#ff6b00;
    margin-bottom:8px;
}

.title{
    text-align:center;
    font-size:26px;
    color:#333;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:bold;
    color:#333;
}

.form-group input{
    width:100%;
    padding:12px 14px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.form-group input:focus{
    border-color:#ff6b00;
    box-shadow:0 0 5px rgba(255,107,0,.2);
}

.login-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#ff6b00;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#e85d00;
}

.signup-text{
    text-align:center;
    margin-top:20px;
    color:#666;
    font-size:14px;
}

.signup-text a{
    color:#ff6b00;
    text-decoration:none;
    font-weight:bold;
}

.signup-text a:hover{
    text-decoration:underline;
}

</style>

</head>
<body>

<div class="login-container">

    <div class="logo">🍴 FoodExpress</div>

    <h2 class="title">Welcome Back</h2>

    <p class="subtitle">
        Login to continue ordering your favorite food.
    </p>

    <!-- Change action to your LoginServlet -->
    <form action="login" method="post">

        <div class="form-group">
            <label>Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <p class="signup-text">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </p>

</div>

</body>
</html>
